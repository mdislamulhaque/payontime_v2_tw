<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Hidmona</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center p-4">
  <main class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
    <header class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 p-6 text-white">
      <div class="flex items-center gap-2 mb-5">
        <div class="w-9 h-9 rounded-xl bg-[#E53935] flex items-center justify-center font-bold shadow-lg shadow-red-500/30">H</div>
        <span class="font-bold text-xl tracking-tight">Hidmona</span>
      </div>
      <h1 class="text-xl font-bold">Welcome Back</h1>
      <p class="text-xs text-slate-300 mt-1">Sign in to send money worldwide with guaranteed exchange rates.</p>
    </header>

    <section class="p-6">
      <div id="message" class="hidden mb-4 p-3 rounded-xl text-xs font-medium"></div>

      <div class="bg-slate-100 p-1 rounded-xl flex items-center text-xs font-semibold text-slate-600 mb-4">
        <button id="emailTab" type="button" class="flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm font-bold">Email Login</button>
        <button id="smsTab" type="button" class="flex-1 py-2 rounded-lg hover:text-slate-900">SMS Login</button>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label id="identifierLabel" class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
          <input id="identifier" type="email" required placeholder="name@example.com"
            class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#E53935] focus:bg-white transition-all">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-bold text-slate-700">Password</label>
            <a href="#" id="forgot" class="text-xs font-semibold text-[#E53935] hover:underline">Forgot?</a>
          </div>
          <div class="relative">
            <input id="password" type="password" required placeholder="••••••••"
              class="w-full px-4 py-3 pr-11 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#E53935] focus:bg-white transition-all">
            <button id="togglePassword" type="button" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">👁</button>
          </div>
        </div>

        <button type="submit"
          class="w-full py-3.5 px-4 bg-[#E53935] hover:bg-[#D32F2F] active:scale-[0.99] text-white font-bold rounded-xl shadow-lg shadow-red-500/20 transition-all text-sm">
          Sign In Securely
        </button>
      </form>

      <div class="text-center pt-5">
        <p class="text-xs text-slate-500">
          Don't have an account?
          <a href="signup.html" class="font-bold text-[#E53935] hover:underline">Sign Up Now</a>
        </p>
      </div>

      <div class="pt-4 mt-4 border-t border-slate-100 flex items-center justify-center gap-2 text-xs text-slate-400 font-medium">
        <span class="text-emerald-500">✓</span>
        Secured with 256-bit SSL Encryption
      </div>
    </section>
  </main>

<script>
const $ = id => document.getElementById(id);
let mode = "email";

$("emailTab").onclick = () => {
  mode = "email";
  $("emailTab").className = "flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm font-bold";
  $("smsTab").className = "flex-1 py-2 rounded-lg hover:text-slate-900";
  $("identifierLabel").textContent = "Email Address";
  $("identifier").type = "email";
  $("identifier").placeholder = "name@example.com";
};

$("smsTab").onclick = () => {
  mode = "sms";
  $("smsTab").className = "flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm font-bold";
  $("emailTab").className = "flex-1 py-2 rounded-lg hover:text-slate-900";
  $("identifierLabel").textContent = "Registered Mobile Number";
  $("identifier").type = "tel";
  $("identifier").placeholder = "+880 1XXXXXXXXX";
};

$("togglePassword").onclick = () => {
  $("password").type = $("password").type === "password" ? "text" : "password";
};

function showMessage(text, success = false) {
  $("message").textContent = text;
  $("message").className = "mb-4 p-3 rounded-xl text-xs font-medium " +
    (success ? "bg-emerald-50 border border-emerald-200 text-emerald-700"
             : "bg-red-50 border border-red-200 text-red-700");
}

$("forgot").onclick = e => {
  e.preventDefault();
  showMessage("Password reset functionality should be connected to your backend/API.");
};

$("loginForm").onsubmit = e => {
  e.preventDefault();

  const identifier = $("identifier").value.trim();
  const password = $("password").value;

  const users = JSON.parse(localStorage.getItem("hidmonaUsers") || "[]");
  const user = users.find(u =>
    mode === "email"
      ? u.email.toLowerCase() === identifier.toLowerCase() && u.password === password
      : u.phone === identifier && u.password === password
  );

  if (!user) {
    showMessage("Invalid login information. Please check your credentials.");
    return;
  }

  localStorage.setItem("hidmonaCurrentUser", JSON.stringify(user));
  showMessage("Login successful! Redirecting...", true);

  setTimeout(() => {
    window.location.href = "index.html";
  }, 700);
};
</script>
</body>
</html>
