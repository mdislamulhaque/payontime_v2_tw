<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Hidmona</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center p-4">
  <main class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100 my-6">
    <header class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 p-6 text-white">
      <div class="flex items-center gap-2 mb-5">
        <div class="w-9 h-9 rounded-xl bg-[#E53935] flex items-center justify-center font-bold shadow-lg shadow-red-500/30">H</div>
        <span class="font-bold text-xl tracking-tight">Hidmona</span>
      </div>
      <h1 class="text-xl font-bold">Create Your Account</h1>
      <p class="text-xs text-slate-300 mt-1">Join Hidmona for zero hidden fees and instant international transfers.</p>
    </header>

    <section class="p-6">
      <div id="message" class="hidden mb-4 p-3 rounded-xl text-xs font-medium"></div>

      <form id="signupForm" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Full Legal Name</label>
          <input id="name" type="text" required placeholder="e.g. Alexander Wright"
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#E53935] focus:bg-white">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
            <input id="email" type="email" required placeholder="alex@example.com"
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#E53935] focus:bg-white">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Phone Number</label>
            <input id="phone" type="tel" required placeholder="+880 1XXXXXXXXX"
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#E53935] focus:bg-white">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Date of Birth</label>
            <input id="dob" type="date" required
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#E53935] focus:bg-white">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Residence Country</label>
            <select id="country" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#E53935] focus:bg-white">
              <option value="Bangladesh">Bangladesh</option>
              <option value="Sweden">Sweden</option>
              <option value="Germany">Germany</option>
              <option value="Norway">Norway</option>
              <option value="USA">USA</option>
              <option value="UK">UK</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
            <input id="password" type="password" required minlength="6" placeholder="••••••••"
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#E53935] focus:bg-white">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Confirm Password</label>
            <input id="confirmPassword" type="password" required minlength="6" placeholder="••••••••"
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#E53935] focus:bg-white">
          </div>
        </div>

        <label class="flex items-start gap-2 cursor-pointer pt-1">
          <input id="terms" type="checkbox" required class="mt-0.5 rounded text-[#E53935] focus:ring-[#E53935]">
          <span class="text-xs text-slate-600 leading-tight">
            I agree to the <a href="#" class="font-semibold text-[#E53935] underline">Terms & Conditions</a> and Privacy Policy.
          </span>
        </label>

        <button type="submit"
          class="w-full py-3 px-4 bg-[#E53935] hover:bg-[#D32F2F] active:scale-[0.99] text-white font-bold rounded-xl shadow-lg shadow-red-500/20 transition-all text-sm mt-2">
          Create Account
        </button>
      </form>

      <div class="text-center pt-4">
        <p class="text-xs text-slate-500">
          Already have an account?
          <a href="login.html" class="font-bold text-[#E53935] hover:underline">Sign In</a>
        </p>
      </div>

      <div class="pt-3 mt-3 border-t border-slate-100 flex items-center justify-center gap-2 text-xs text-slate-400 font-medium">
        <span class="text-emerald-500">✓</span>
        Secured with 256-bit SSL Encryption
      </div>
    </section>
  </main>

<script>
const $ = id => document.getElementById(id);

function showMessage(text, success = false) {
  $("message").textContent = text;
  $("message").className = "mb-4 p-3 rounded-xl text-xs font-medium " +
    (success ? "bg-emerald-50 border border-emerald-200 text-emerald-700"
             : "bg-red-50 border border-red-200 text-red-700");
}

$("signupForm").onsubmit = e => {
  e.preventDefault();

  const name = $("name").value.trim();
  const email = $("email").value.trim();
  const phone = $("phone").value.trim();
  const dob = $("dob").value;
  const country = $("country").value;
  const password = $("password").value;
  const confirmPassword = $("confirmPassword").value;

  if (password !== confirmPassword) {
    showMessage("Passwords do not match.");
    return;
  }

  if (password.length < 6) {
    showMessage("Password must contain at least 6 characters.");
    return;
  }

  const users = JSON.parse(localStorage.getItem("hidmonaUsers") || "[]");

  if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
    showMessage("An account already exists with this email address.");
    return;
  }

  if (users.some(u => u.phone === phone)) {
    showMessage("An account already exists with this phone number.");
    return;
  }

  const user = { name, email, phone, dob, country, password };
  users.push(user);

  localStorage.setItem("hidmonaUsers", JSON.stringify(users));

  showMessage("Account created successfully! Redirecting to login...", true);

  $("signupForm").reset();

  setTimeout(() => {
    window.location.href = "login.html";
  }, 900);
};
</script>
</body>
</html>
